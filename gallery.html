<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Amii PORTFOLIO | Gallery</title>
  <meta name="description" content="Amii — 透明水彩や顔彩を使った作品ギャラリー" />

  <!-- フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:"Noto Sans JP","Inter",sans-serif;
      background:#fff;
      color:#111;
      line-height:1.7;
    }

    header{
      max-width:900px;
      margin:40px auto;
      padding:0 20px;
    }

    .header-title{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .header-title h1{
      font-size:30px;
      margin:0;
      font-weight:600;
      white-space:nowrap;
    }

    .header-logo{
      height:60px;
    }

    nav ul{
      list-style:none;
      padding:0;
      margin:20px 0;
      display:flex;
      gap:20px;
      flex-wrap:wrap;
      font-size:14px;
    }

    nav a{
      text-decoration:none;
      color:#333;
      font-weight:500;
    }

    nav a:hover{
      text-decoration:underline;
    }

    main{
      max-width:900px;
      margin:0 auto;
      padding:0 20px 60px;
    }

    /* ギャラリー */
    .gallery{
      display:flex;
      gap:20px;
      align-items:flex-start;
      justify-content:center;
    }

    .column{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .gallery img{
      width:100%;
      display:block;
      border-radius:8px;
      cursor:pointer;
      transition:transform .2s ease;
      will-change:transform;
    }

    .gallery img:hover{
      transform:scale(1.02);
    }

    /* ライトボックス */
    #lightbox{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.85);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      padding:20px;
      box-sizing:border-box;
      z-index:9999;
    }

    #lightbox img{
      max-width:90%;
      max-height:70%;
      object-fit:contain;
      border-radius:8px;
      display:block;
    }

    #lightbox h3{
      color:#fff;
      margin:15px 0 5px;
      font-size:18px;
      text-align:center;
      font-weight:500;
    }

    #lightbox p{
      color:#ccc;
      margin:0;
      font-size:14px;
      text-align:center;
    }

    footer{
      text-align:center;
      font-size:13px;
      color:#666;
      padding:30px 0;
      border-top:1px solid #eee;
    }

    footer a{
      color:#555;
      text-decoration:none;
      margin:0 8px;
    }

    footer a:hover{
      text-decoration:underline;
    }

    /* スマホ */
    @media (max-width:600px){

      header{
        margin:25px auto;
      }

      .gallery{
        gap:10px;
      }

      .column{
        gap:10px;
      }

      .header-logo{
        height:48px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-title">
      <h1>Amii PORTFOLIO</h1>
      <img src="images/logo.png" alt="飾りイラスト" class="header-logo">
    </div>

    <nav>
      <ul>
        <li><a href="index.html">home</a></li>
        <li><a href="profile.html">profile</a></li>
        <li><a href="gallery.html">gallery</a></li>
        <li><a href="contact.html">contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <h2>Gallery</h2>

    <div class="gallery">
      <div class="column" id="col1"></div>
      <div class="column" id="col2"></div>
    </div>

  </main>

  <!-- ライトボックス -->
  <div id="lightbox">
    <img src="" alt="">
    <h3></h3>
    <p></p>
  </div>

  <footer>
    <p>© <span id="year"></span> Amii</p>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    /*
      ▼ 画像追加方法 ▼

      1. imagesフォルダに画像を入れる
      2. 下に1行コピペするだけ！

      {
        src:"images/work28.jpg",
        title:"タイトル",
        caption:"透明水彩 / 2026",
        year:2026
      },

    */

    const images = [

      {src:"images/work01.jpg", title:"papillon", caption:"透明水彩 / 2026", year:2026},
      {src:"images/work02.jpg", title:"ある少女の恋", caption:"透明水彩 / 2026", year:2026},
      {src:"images/work03.jpg", title:"離れゆく愛", caption:"デジタル（Procreate） / 2026", year:2026},
      {src:"images/work04.jpg", title:"あなたは私を知らない", caption:"デジタル（Procreate） / 2026", year:2026},
      {src:"images/work05.jpg", title:"私はあなたを知らない", caption:"デジタル（Procreate） / 2026", year:2026},
      {src:"images/work06.jpg", title:"鳥になりたい", caption:"透明水彩 / 2026", year:2026},
      {src:"images/work07.jpg", title:"ウェルカムボード（依頼）", caption:"顔彩 / 2026", year:2026},

      {src:"images/work08.jpg", title:"百万年の孤独", caption:"透明水彩 / 2025", year:2025},
      {src:"images/work09.jpg", title:"胡蝶の夢", caption:"透明水彩 / 2025", year:2025},
      {src:"images/work10.jpg", title:"帰郷", caption:"顔彩 / 2025", year:2025},
      {src:"images/work11.jpg", title:"すべて私の記憶", caption:"透明水彩 / 2025", year:2025},
      {src:"images/work12.jpg", title:"この悲しみを愛とは呼ばない", caption:"透明水彩 / 2025", year:2025},
      {src:"images/work13.jpg", title:"海に眠る", caption:"顔彩 / 2025", year:2025},
      {src:"images/work14.jpg", title:"おやすみガオガオ", caption:"顔彩 / 2025", year:2025},
      {src:"images/work15.jpg", title:"私が私であるために", caption:"透明水彩 / 2025", year:2025},
      {src:"images/work16.jpg", title:"安全地帯", caption:"アクリルガッシュ・胡粉 / 2025", year:2025},
      {src:"images/work17.jpg", title:"木星と猫", caption:"透明水彩 / 2025", year:2025},

      {src:"images/work18.jpg", title:"優しい呼吸", caption:"透明水彩 / 2024", year:2024},
      {src:"images/work19.jpg", title:"好日", caption:"顔彩 / 2024", year:2024},
      {src:"images/work20.jpg", title:"この香りを憶えている", caption:"透明水彩 / 2024", year:2024},

      {src:"images/work21.jpg", title:"大丈夫", caption:"アクリルガッシュ / 2022", year:2022},
      {src:"images/work22.jpg", title:"ごろんねこ", caption:"アクリルガッシュ / 2022", year:2022},
      {src:"images/work23.jpg", title:"おやすみに魔法をかけて", caption:"アクリルガッシュ / 2022", year:2022},
      {src:"images/work24.jpg", title:"ごろんねこ２", caption:"アクリルガッシュ / 2022", year:2022},
      {src:"images/work25.jpg", title:"pâtisserieワンワン", caption:"アクリルガッシュ / 2022", year:2022},

      {src:"images/work26.jpg", title:"君がいる星", caption:"透明水彩 / 2021", year:2021},

    ];

    const col1 = document.getElementById("col1");
    const col2 = document.getElementById("col2");

    // 新しい順
    images.sort((a, b) => b.year - a.year);

    // 左→右→左→右
    images.forEach((data, index) => {

      const img = document.createElement("img");

      img.src = data.src;
      img.alt = data.title;

      img.loading = "lazy";
      img.decoding = "async";

      img.dataset.title = data.title;
      img.dataset.caption = data.caption;

      if(index % 2 === 0){
        col1.appendChild(img);
      } else {
        col2.appendChild(img);
      }

      // ライトボックス
      img.addEventListener("click", () => {

        lightbox.style.display = "flex";

        lightboxImg.src = data.src;
        lightboxImg.alt = data.title;

        lightboxTitle.textContent = data.title;
        lightboxCaption.textContent = data.caption;
      });
    });

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = lightbox.querySelector("img");
    const lightboxTitle = lightbox.querySelector("h3");
    const lightboxCaption = lightbox.querySelector("p");

    // 閉じる
    lightbox.addEventListener("click", (e) => {
      if(e.target === lightbox){
        lightbox.style.display = "none";
      }
    });

    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape"){
        lightbox.style.display = "none";
      }
    });

  </script>

</body>
</html>
