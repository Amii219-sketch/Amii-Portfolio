<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Works - Amii PORTFOLIO</title>
    <meta name="description" content="Amii — Works（実績紹介）" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: "Noto Sans JP", "Inter", sans-serif;
            background: #fff;
            color: #111;
            line-height: 1.7;
        }
        header {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-title h1 {
            font-size: 30px;
            margin: 0;
            font-weight: 600;
            white-space: nowrap;
        }
        .header-logo {
            height: 60px;
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        nav a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }
        
        /* Worksスタイル */
        .work-section {
            margin-bottom: 60px;
        }
        .work-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        /* サムネイル（メイン画像） */
        .work-thumbnail {
            width: 100%;
            max-width: 450px;
            cursor: pointer;
            display: block;
            margin-bottom: 15px;
            transition: opacity 0.3s;
        }
        .work-thumbnail:hover {
            opacity: 0.8;
        }
        /* サブ画像（最初は隠しておく） */
        .sub-images {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .sub-images img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* 開閉ボタン */
        .toggle-btn {
            background: none;
            border: 1px solid #333;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s, color 0.3s;
        }
        .toggle-btn:hover {
            background: #333;
            color: #fff;
        }

        footer {
            text-align: center;
            font-size: 13px;
            color: #666;
            padding: 30px 0;
            border-top: 1px solid #eee;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>Amii PORTFOLIO</h1>
            <img src="images/logo.png" alt="飾りイラスト" class="header-logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">home</a></li>
                <li><a href="profile.html">profile</a></li>
                <li><a href="works.html">works</a></li>
                <li><a href="gallery.html">gallery</a></li>
                <li><a href="contact.html">contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 作品1つ目：commons&sense -->
        <div class="work-section">
            <h2 class="work-title">commons&sense ISSUE71 ファッションストーリーイラスト全16p</h2>
            
            <!-- サムネイル画像（クリックまたはボタンで他の画像が開きます） -->
            <img src="images/Commons&sense1.jpg" alt="commons&sense サムネイル" class="work-thumbnail" onclick="toggleImages(this)">
            
            <div>
                <button class="toggle-btn" onclick="toggleImages(this)">ほかの画像（全16p）を見る</button>
            </div>

            <!-- 2枚目〜8枚目の画像（ここに残りの画像が並びます） -->
            <div class="sub-images">
                <img src="images/Commons&sense2.jpg" alt="commons&sense 2">
                <img src="images/Commons&sense3.jpg" alt="commons&sense 3">
                <img src="images/Commons&sense4.jpg" alt="commons&sense 4">
                <img src="images/Commons&sense5.jpg" alt="commons&sense 5">
                <img src="images/Commons&sense6.jpg" alt="commons&sense 6">
                <img src="images/Commons&sense7.jpg" alt="commons&sense 7">
                <img src="images/Commons&sense8.jpg" alt="commons&sense 8">
            </div>
        </div>
    </main>

    <footer>
        <p>Contact: <a href="mailto:amii.world219@gmail.com">amii.world219@gmail.com</a></p>
        <p>
            <a href="https://www.instagram.com/amii_219/?hl=ja" target="_blank">Instagram</a> | 
            <a href="https://x.com/Amii__0219" target="_blank">X</a>
        </p>
        <p>© <span id="year"></span> Amii</p>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        // 画像やボタンを押したときに、残りの画像を表示・非表示にする仕組み
        function toggleImages(element) {
            const section = element.closest('.work-section');
            const subImages = section.querySelector('.sub-images');
            const btn = section.querySelector('.toggle-btn');

            if (subImages.style.display === 'grid') {
                subImages.style.display = 'none';
                btn.textContent = 'ほかの画像（全16p）を見る';
            } else {
                subImages.style.display = 'grid';
                btn.textContent = '画像を閉じる';
            }
        }
    </script>
</body>
</html>
