<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Works - Amii PORTFOLIO</title>
    <meta name="description" content="Amii — Works（実績紹介）" />
    <!-- Google Fonts: 英語用(Inter)と、洗練されたきれいなゴシック体(Noto Sans JP)を読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: "Noto Sans JP", "Inter", sans-serif;
            background: #fff;
            color: #111;
            line-height: 1.8;
            letter-spacing: 0.03em;
        }
        header {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-title h1 {
            font-family: "Inter", sans-serif;
            font-size: 30px;
            margin: 0;
            font-weight: 600;
            white-space: nowrap;
            letter-spacing: -0.02em;
        }
        .header-logo {
            height: 60px;
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 14px;
            font-family: "Inter", sans-serif;
        }
        nav a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }
        
        /* Worksスタイル */
        .work-section {
            margin-bottom: 80px;
        }
        .work-title {
            font-family: "Noto Sans JP", sans-serif;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        
        /* メイン画像（大きく表示する場所） */
        .main-display {
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .main-display img {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        /* 小さく並べるサムネイル画像リスト */
        .thumbnail-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 600px;
        }
        .thumbnail-list img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
            border: 1px solid #eee;
        }
        .thumbnail-list img:hover {
            opacity: 1;
        }
        /* 今選ばれている画像の目印 */
        .thumbnail-list img.active {
            opacity: 1;
            border-color: #111;
        }

        footer {
            text-align: center;
            font-size: 13px;
            color: #666;
            padding: 30px 0;
            border-top: 1px solid #eee;
            font-family: "Inter", sans-serif;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>Amii PORTFOLIO</h1>
            <img src="images/logo.png" alt="飾りイラスト" class="header-logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">home</a></li>
                <li><a href="profile.html">profile</a></li>
                <li><a href="works.html">works</a></li>
                <li><a href="gallery.html">gallery</a></li>
                <li><a href="contact.html">contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 作品1つ目（最新）：寝ながら学べる因果推論 -->
        <div class="work-section">
            <h2 class="work-title">講談社『寝ながら学べる因果推論』装画/カットイラスト</h2>
            
            <div class="main-display">
                <img id="current-image-1" src="images/inga1.jpg" alt="寝ながら学べる因果推論 メイン画像">
            </div>
            
            <div class="thumbnail-list">
                <img src="images/inga1.jpg" alt="1" class="active" onclick="changeImage(this, 'images/inga1.jpg', 'current-image-1')">
                <img src="images/inga2.jpg" alt="2" onclick="changeImage(this, 'images/inga2.jpg', 'current-image-1')">
            </div>
        </div>

        <!-- 作品2つ目：commons&sense -->
        <div class="work-section">
            <h2 class="work-title">commons&sense ISSUE71 ファッションストーリーイラスト全16p</h2>
            
            <div class="main-display">
                <img id="current-image-2" src="images/Commons&sense1.jpg" alt="commons&sense メイン画像">
            </div>
            
            <div class="thumbnail-list">
                <img src="images/Commons&sense1.jpg" alt="1" class="active" onclick="changeImage(this, 'images/Commons&sense1.jpg', 'current-image-2')">
                <img src="images/Commons&sense2.jpg" alt="2" onclick="changeImage(this, 'images/Commons&sense2.jpg', 'current-image-2')">
                <img src="images/Commons&sense3.jpg" alt="3" onclick="changeImage(this, 'images/Commons&sense3.jpg', 'current-image-2')">
                <img src="images/Commons&sense4.jpg" alt="4" onclick="changeImage(this, 'images/Commons&sense4.jpg', 'current-image-2')">
                <img src="images/Commons&sense5.jpg" alt="5" onclick="changeImage(this, 'images/Commons&sense5.jpg', 'current-image-2')">
                <img src="images/Commons&sense6.jpg" alt="6" onclick="changeImage(this, 'images/Commons&sense6.jpg', 'current-image-2')">
                <img src="images/Commons&sense7.jpg" alt="7" onclick="changeImage(this, 'images/Commons&sense7.jpg', 'current-image-2')">
                <img src="images/Commons&sense8.jpg" alt="8" onclick="changeImage(this, 'images/Commons&sense8.jpg', 'current-image-2')">
            </div>
        </div>
    </main>

    <footer>
        <p>Contact: <a href="mailto:amii.world219@gmail.com">amii.world219@gmail.com</a></p>
        <p>
            <a href="https://www.instagram.com/amii_219/?hl=ja" target="_blank">Instagram</a> | 
            <a href="https://x.com/Amii__0219" target="_blank">X</a>
        </p>
        <p>© <span id="year"></span> Amii</p>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        // 画像切り替えの仕組み
        function changeImage(element, imageSrc, targetId) {
            const section = element.closest('.work-section');
            const mainImg = section.querySelector('#' + targetId);
            
            mainImg.src = imageSrc;

            const thumbnails = section.querySelectorAll('.thumbnail-list img');
            thumbnails.forEach(img => img.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
