<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>送信完了 | Amii PORTFOLIO</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .box {
      max-width: 500px;
      width: 100%;
      text-align: center;
      border: 1px solid #eee;
      padding: 50px 30px;
      border-radius: 12px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    p {
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    a {
      display: inline-block;
      padding: 10px 24px;
      background: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.2s;
    }

    a:hover {
      background: #555;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>送信完了</h1>

    <p>
      お問い合わせありがとうございます。<br>
      内容を確認後、ご返信いたします。
    </p>

    <a href="index.html">TOPへ戻る</a>
  </div>

</body>
</html>
